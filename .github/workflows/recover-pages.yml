name: Clear stuck Pages deployment
on:
  push:
    paths:
      - .github/workflows/recover-pages.yml
  workflow_dispatch:
permissions:
  pages: write
  actions: write
jobs:
  cancel-stuck-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the identified stalled deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/chiragpokhriyall/portfolio/actions/runs/38769289000/cancel || gh api --method POST repos/chiragpokhriyall/portfolio/actions/runs/38769289000/force-cancel
          gh api --method POST repos/chiragpokhriyall/portfolio/pages/deployments/ed0f78bd39b4f9ca44751b4e59460c95fa65e57e/cancel
          gh api repos/chiragpokhriyall/portfolio/pages/deployments/ed0f78bd39b4f9ca44751b4e59460c95fa65e57e/status
